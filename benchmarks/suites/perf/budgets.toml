# Performance budgets. A budget is a hard limit that fails CI when exceeded.
#
# Budgets are enforced only on the reference platform (Linux, GitHub Actions
# ubuntu-latest), like fx does: macOS and laptop timings are reported but too
# noisy to gate on. Budgets apply to our own binaries only; competitors are
# measured, never gated.
#
# Metric keys are "<metric>.<stat>" from the result file, e.g. wall_ms.p50.
# Initial values are deliberately loose; tighten them as the real agent lands
# (fx gates its CLI start-up at 2 ms on Linux).

[perf-startup.flores]
# Start from the stub's limits; tighten once Linux CI has measured flores.
"wall_ms.p50" = 5.0
"rss_mb.p50" = 12.0

[perf-hello.flores]
"wall_ms.p50" = 50.0
"rss_mb.p50" = 15.0
"request_bytes.p50" = 4096

# flores-openai is the same binary speaking Chat Completions: same limits.
[perf-startup.flores-openai]
"wall_ms.p50" = 5.0
"rss_mb.p50" = 12.0

[perf-hello.flores-openai]
"wall_ms.p50" = 50.0
"rss_mb.p50" = 15.0
"request_bytes.p50" = 4096

[perf-startup.flores-stub]
"wall_ms.p50" = 5.0
"rss_mb.p50" = 12.0  # measured 5.6 MiB on Linux with tools/measure (floor ~2.4)

[perf-hello.flores-stub]
"wall_ms.p50" = 50.0
"rss_mb.p50" = 15.0  # measured 6.9 MiB on Linux; the old 30 only fit the inherited-RSS artefact
"request_bytes.p50" = 4096

# Layer B (harness behaviour). Deterministic, so enforced on every platform.
# Ratchet: when flores starts passing a scenario, add it to must_pass so it
# can never silently regress. flores-stub has no tools and no retries: it is
# the "red" starting point of the behaviour TDD.
[harness.flores]
# runaway-tool-loop passes with no step limit thanks to repetition detection
# (ADR 0003); the *-recover scenarios and retry-after-too-long thanks to
# retries (ADR 0004); out-of-credit-fail-fast thanks to ErrQuota (ADR 0005).
# M2 adds the tool scenarios.
must_pass = [
  "basic-text", "unknown-tool", "auth-error-fail-fast", "runaway-tool-loop",
  "malformed-tool-args", "huge-output", "slow-first-token",
  "rate-limit-recover", "server-error-recover", "stream-truncated-recover",
  "retry-after-too-long", "out-of-credit-fail-fast",
]

# Same binary, other protocol (ADR 0005): the same list, so neither adapter
# can fall behind the other.
[harness.flores-openai]
must_pass = [
  "basic-text", "unknown-tool", "auth-error-fail-fast", "runaway-tool-loop",
  "malformed-tool-args", "huge-output", "slow-first-token",
  "rate-limit-recover", "server-error-recover", "stream-truncated-recover",
  "retry-after-too-long", "out-of-credit-fail-fast",
]

[harness.flores-stub]
must_pass = ["basic-text", "unknown-tool", "auth-error-fail-fast", "runaway-tool-loop"]
