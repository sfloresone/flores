[project]
name = "flores-bench"
version = "0.1.0"
description = "Benchmark and evaluation suite for the flores coding agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
flores-bench = "flores_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
tasks = [
    "harbor==0.25.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flores_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Task fixtures are inputs to the agents under test: their exact bytes are part
# of the task (tests check hashes), so no tool may reformat them.
extend-exclude = ["tasks/flores-micro"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# generate.py embeds Go sources (tab-indented) and checker scripts as strings.
"tasks/generate.py" = ["E101", "W191", "E501"]
