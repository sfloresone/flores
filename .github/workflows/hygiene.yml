name: Repo hygiene

# Runs on every PR, whatever it touches. Checks each commit of the PR, not only
# the final diff, because merges keep the whole branch history in main.

on:
  pull_request:

permissions:
  contents: read

jobs:
  new-blobs:
    name: No binaries or large files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every blob added by the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-new-blobs.sh "$BASE_SHA" "$HEAD_SHA"
