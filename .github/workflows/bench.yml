name: Benchmarks

# Layer A (perf) benchmarks on the Linux reference platform.
#
# - pull_request: tests + benchmarks + budget gate; results uploaded as an artifact.
# - push to main: same, then the compact results are published into
#   benchmarks/published/ so they are versioned and the website can read them.
#   They reach main through a pull request the job opens and merges itself.
# - workflow_dispatch: manual run (e.g. after bumping a competitor version).
#
# No step here talks to a real model: every agent runs against the mock provider.

on:
  push:
    branches: [main]
    paths: ["benchmarks/**", "apps/cli/**", ".github/workflows/bench.yml"]
  pull_request:
    paths: ["benchmarks/**", "apps/cli/**", ".github/workflows/bench.yml"]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPERFINE_VERSION: "2.0.0"

defaults:
  run:
    working-directory: benchmarks

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/go.mod
          cache-dependency-path: benchmarks/go.mod
      - uses: astral-sh/setup-uv@v5
      - name: Go vet + tests (bench helpers)
        run: go vet ./... && go test ./...
      - name: Go vet + tests (flores, apps/cli)
        working-directory: apps/cli
        run: test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
      - name: Python lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Python tests
        run: uv run pytest -q
      - name: Scenario docs are up to date
        run: uv run flores-bench scenarios --write-docs && git diff --exit-code -- docs/harness-scenarios.md
      - name: Layer B gate (flores and flores-stub, deterministic)
        run: uv run flores-bench harness --agents flores,flores-stub --enforce --out results/harness-gate.json

  perf:
    name: Perf (linux reference)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to push the published-results branch on main
      pull-requests: write # ...and to open and merge its pull request
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/go.mod
          cache-dependency-path: benchmarks/go.mod
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install hyperfine
        run: |
          wget -q "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_amd64.deb"
          sudo dpkg -i "hyperfine_${HYPERFINE_VERSION}_amd64.deb"

      - name: Install competitor agents (pinned versions from suites/perf/agents.toml)
        continue-on-error: true
        run: |
          for spec in $(uv run flores-bench pinned); do
            npm install -g "$spec" || echo "::warning::could not install $spec"
          done

      - name: Install fx
        continue-on-error: true
        run: |
          curl -fsSL https://fx.sh/setup.sh | bash -s -- "v$(uv run flores-bench pinned --agent fx)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: uv run flores-bench doctor

      - name: perf startup
        run: uv run flores-bench perf startup --out results/startup.json

      - name: perf hello
        run: uv run flores-bench perf hello --out results/hello.json

      - name: Layer B matrix (all agents)
        run: uv run flores-bench harness --out results/harness.json

      - name: Enforce budgets
        run: uv run flores-bench check-budgets results/startup.json results/hello.json results/harness.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.sha }}
          path: benchmarks/results/*.json
          if-no-files-found: warn

      # main only accepts pull requests (ruleset protect-main), so the results
      # go through a PR that this job opens and merges itself. Pushes and PRs
      # made with GITHUB_TOKEN trigger no workflows, so this cannot loop.
      - name: Publish results (through a pull request)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run flores-bench publish results/startup.json results/hello.json results/harness.json
          git add published
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          short="${GITHUB_SHA::10}"
          branch="bench/publish-$short"
          title="bench: publish linux results for $short [skip ci]"
          git config user.name "flores-bench[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Linux reference results for $GITHUB_SHA, published by the [Benchmarks run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Only benchmarks/published/ changes."
          gh pr merge "$branch" --squash --delete-branch --subject "$title"
